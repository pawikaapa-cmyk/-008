<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อ — ผึ้งสีเหลือง</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container nav">
      <a href="index.html" class="nav__brand">ผึ้งสีเหลือง</a>
      <nav class="nav__links" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
        <a href="order.html">สั่งซื้อ</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section section--white">
      <div class="container" style="max-width:560px;">
        <div class="section__head" style="margin-bottom:var(--s-4);">
          <span class="eyebrow">Order</span>
          <h1>สั่งซื้อสินค้า</h1>
          <span class="divider center"></span>
          <p>กรอกข้อมูลด้านล่าง เราจะติดต่อกลับเพื่อยืนยันการสั่งซื้อ</p>
        </div>

        <form id="orderForm">
          <div class="field">
            <label for="customerName">ชื่อลูกค้า</label>
            <input type="text" id="customerName" name="customerName" autocomplete="name" required>
          </div>

          <div class="field">
            <label for="contact">เบอร์โทร / Line</label>
            <input type="text" id="contact" name="contact" autocomplete="tel" required>
          </div>

          <div class="field">
            <label for="items">รายการสินค้า</label>
            <input type="text" id="items" name="items" required>
          </div>

          <div class="field">
            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input type="text" id="total" name="total" inputmode="numeric" required>
          </div>

          <div class="field">
            <label for="note">หมายเหตุ</label>
            <textarea id="note" name="note" rows="3"></textarea>
          </div>

          <div class="text-center mt-4">
            <button type="submit" class="btn btn--gold">ยืนยันสั่งซื้อ</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container text-center">
      <a href="index.html" class="nav__brand">ผึ้งสีเหลือง</a>
      <p class="mt-3">ความหวานแท้บริสุทธิ์จากธรรมชาติ</p>
      <div class="site-footer__bottom">© ผึ้งสีเหลือง</div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
